# Identidade AWS do pod por EKS Pod Identity: a associação
# (namespace billing-prod + service account billing → role oficina-billing-pod)
# está em infra/pod.tf. Nenhuma chave AWS no cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: oficina
