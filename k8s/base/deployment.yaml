apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: oficina
spec:
  # Réplica única, sem HPA (corte 7′ do plano da Fase 4): o cluster é pequeno
  # e o volume da demo não pede mais. O relay da outbox usa advisory lock do
  # Postgres, então um surge de 2 pods no rollout não publica fora de ordem.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/part-of: oficina
    spec:
      serviceAccountName: billing
      # Nível do pod: vale para qualquer container (inclusive sidecars
      # injetados). O do container abaixo continua restringindo o resto.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # O pod não fala com a API do Kubernetes. A credencial AWS do Pod
      # Identity chega por um volume projetado próprio, independente disto.
      automountServiceAccountToken: false
      # O consumidor termina a mensagem em andamento (inclui chamada ao MP)
      # antes de sair; o visibility timeout da fila é 60 s.
      terminationGracePeriodSeconds: 90
      containers:
        - name: billing
          # Tag substituída pelo CD (kustomize edit set image)
          image: docker.io/problematheu/oficina-billing:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: billing-config
            # Gerado pelo CD a partir da SSM; vem depois, então prevalece.
            - configMapRef:
                name: billing-ambiente
            - secretRef:
                name: billing-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # UID/GID do usuário "app" criado no Dockerfile
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
