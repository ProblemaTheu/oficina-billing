apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sem Namespace aqui: `billing-prod` é criado pelo Terraform do
# oficina-infra-k8s. A role de CD deste repositório só tem Edit DENTRO do
# namespace, e namespace é recurso de escopo de cluster.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
# O Secret billing-secrets NÃO é versionado: ver secret.example.yaml e
# scripts/prod-secret.sh. O ConfigMap billing-ambiente (filas, host do RDS,
# URL pública) é gerado pelo CD a partir da SSM.
