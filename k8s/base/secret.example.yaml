# TEMPLATE — não aplicar com valores reais versionados.
#
# Em produção o Secret é criado por scripts/prod-secret.sh a partir do
# Secrets Manager (credenciais do RDS do Terraform, JWT compartilhado do
# oficina-app e credenciais do Mercado Pago). Nada passa por argumento.
apiVersion: v1
kind: Secret
metadata:
  name: billing-secrets
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: oficina
type: Opaque
stringData:
  # Valores vazios de propósito: preenchidos pelo scripts/prod-secret.sh.
  DB_USER: ""
  DB_PASSWORD: ""
  JWT_SECRET: ""
  MP_ACCESS_TOKEN: ""
  MP_WEBHOOK_SECRET: ""
  NEW_RELIC_LICENSE_KEY: ""
