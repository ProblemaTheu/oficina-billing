# Overlay de produção — EKS na conta da Fase 4, namespace billing-prod.
#
# O namespace e a access entry da role de CD (Edit só neste namespace) são do
# oficina-infra-k8s. O ConfigMap billing-ambiente e o Secret billing-secrets
# precisam existir antes do primeiro rollout (o CD cria o primeiro; o segundo
# é do scripts/prod-secret.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: billing-prod

resources:
  - ../../base

images:
  - name: docker.io/problematheu/oficina-billing
    newTag: latest

patches:
  # Borda: Classic Load Balancer, como o OS na Fase 3. ⚠️ Não acrescentar
  # `aws-load-balancer-type: nlb` — contas novas costumam responder
  # OperationNotPermitted na API ELBv2 (ver k8s/overlays/prod do oficina-app).
  # O API Gateway aponta para o DNS deste balanceador (F4-6.5).
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: billing
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      spec:
        type: LoadBalancer
